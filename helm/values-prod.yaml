image:
  repository: harbor.online.tkbbank.ru/tkbpay/payconfig_server   # tag injected by CI (--set image.tag)
serviceAccount:
  name: prod-adapters            # TODO: confirm SA for the prod namespace
vault:
  enabled: false
replicaCount: 2

# Config Server is cluster-internal — clients reach it via the Service DNS, not from outside.
ingress:
  enabled: false

ports:
  - containerPort: 8080
service:
  name: payconfig-server         # clients use CONFIG_SERVER_URL=http://payconfig-server:8080
  port: 8080
  targetPort: 8080

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  httpGet:
    path: /actuator/health
    port: 8080
readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  httpGet:
    path: /actuator/health
    port: 8080

extraEnvs:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: CONFIG_GIT_URI
    value: "https://git.tkbbank.ru/tkbpay/.../pay-config-repo.git"   # TODO: real config-repo backend URL
  - name: CONFIG_GIT_LABEL
    value: prod                  # environment = git branch
  - name: CONFIG_GIT_USERNAME
    value: "config-repo-deploy-token"
  - name: CONFIG_SERVER_USER
    value: configadmin
  # --- Secrets via pre-created k8s Secret `payconfig-server-secret` (see values-test.yaml note).
  - name: CONFIG_GIT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: payconfig-server-secret
        key: CONFIG_GIT_PASSWORD
  - name: CONFIG_SERVER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: payconfig-server-secret
        key: CONFIG_SERVER_PASSWORD
