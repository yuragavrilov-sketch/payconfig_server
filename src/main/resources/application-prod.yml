spring:
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_PASSWORD:}
          default-label: ${CONFIG_GIT_LABEL:prod}
          clone-on-start: true
          force-pull: true
          timeout: 10
          # Corp GitLab uses an internal CA the JRE base image doesn't trust.
          # Skip TLS validation for the git backend (internal network), mirroring the
          # `--insecure-skip-tls-verify` already used for the corp Helm repo.
          skip-ssl-validation: ${CONFIG_GIT_SKIP_SSL:false}
  security:
    user:
      name: ${CONFIG_SERVER_USER:configadmin}
      password: ${CONFIG_SERVER_PASSWORD:}

payconfig-server:
  security:
    basic-auth-enabled: true
