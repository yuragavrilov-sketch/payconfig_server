server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: config-server
  profiles:
    default: local
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:file:///config-repo}
          default-label: ${CONFIG_GIT_LABEL:master}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
